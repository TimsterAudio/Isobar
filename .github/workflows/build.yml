# Builds Isobar for Windows and Linux on every push to main, and publishes
# the programs on the Releases page: as "Latest build" for main, or as a named
# release for a version tag such as v0.2.0.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: isobar-windows-x64.exe
          # The oldest supported Ubuntu, so the program runs on older distributions too.
          - os: ubuntu-22.04
            artifact: isobar-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo build --release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/release/isobar.exe ${{ matrix.artifact }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf ${{ matrix.artifact }} -C target/release isobar
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: cd dist && sha256sum isobar-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Move the latest-build tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest-build
          git push -f origin latest-build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Isobar {0}', github.ref_name) || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          body: |
            Download `isobar-windows-x64.exe` for Windows, or `isobar-linux-x64.tar.gz` for Linux. Each is the whole program.

            Built from ${{ github.sha }} by GitHub Actions, straight from the source in this repository.

            To check a download is the file GitHub built, compare its SHA-256 with `SHA256SUMS.txt`. On Windows, in PowerShell: `Get-FileHash isobar-windows-x64.exe`. On Linux: `sha256sum isobar-linux-x64.tar.gz`.

            The program isn't code-signed yet, so Windows Defender's machine-learning check can flag a new build as suspicious (for example `Bearfoos.b!ml`). That's a guess about an unfamiliar file, not a known threat.
          files: dist/*
