[workspace]
members = ["crates/isobar-core"]

[package]
name = "isobar"
version = "0.7.0"
description = "A desktop companion for Cumulus MX weather stations"
edition = "2021"
default-run = "isobar"


[dependencies]
isobar-core = { path = "crates/isobar-core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
notify-rust = "4"
egui_extras = { version = "0.36", default-features = false, features = ["datepicker"] }
jiff = "0.2"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
